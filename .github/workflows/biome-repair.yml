# SPDX-License-Identifier: AGPL-3.0-or-later
name: Biome repair
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: read
  actions: write
concurrency:
  group: biome-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  repair:
    uses: edbfi/automation/.github/workflows/biome-repair.yml@v2.0.0
    secrets:
      repair-app-private-key: ${{ secrets.RENOVATE_REPAIR_APP_PRIVATE_KEY }}
    with:
      repair-app-client-id: ${{ vars.RENOVATE_REPAIR_APP_CLIENT_ID }}
      config-files: biome.json
      source-roots: |
        src
        scripts
        e2e
        astro.config.mjs
        uno.config.ts
        svelte.config.js
        playwright.config.ts
      # renovate: datasource=npm depName=bun
      bun-version: 1.4.2
