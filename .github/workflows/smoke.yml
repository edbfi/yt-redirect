name: smoke
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  smoke:
    name: serve and verify published routes
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.14'
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: 24.21.0
    - uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version-file: package.json
    - uses: actions/download-artifact@v8.0.1
      with:
        name: site-dist
        path: dist/
    - uses: edbfi/automation/actions/smoke@v3.1.0
      with:
        start-command: PORT=4321 bun run scripts/serve-dist.ts
        url: http://127.0.0.1:4321/
        test-command: bash .github/scripts/smoke.sh --assert-only
        timeout-seconds: 90
        test-timeout-seconds: 60
    - name: Reject tracked-file mutations
      run: git diff --exit-code HEAD
