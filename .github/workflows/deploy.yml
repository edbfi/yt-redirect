# Publish the built static site to GitHub Pages at https://yt.edb.fi.
#
# The app is `output: "static"` with no adapter and no server, so the deployable
# artefact is exactly `dist/`. peaceiris/actions-gh-pages force-pushes that
# directory to the `gh-pages` branch and writes the CNAME file on every run,
# which is why the custom domain survives a redeploy instead of being reset.
#
# Successful final CI dispatches this publisher for the exact main commit.
# The revision and final CI are checked before publication.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      expected-default-sha:
        description: Exact default-branch commit requested after a checked merge
        type: string
        default: ''

# Least privilege, stated explicitly rather than inherited from the repository
# default (currently "write"). peaceiris/actions-gh-pages pushes the built site
# to the gh-pages branch using GITHUB_TOKEN. Actions read verifies final CI.
permissions:
  contents: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v1.1.0
        with:
          token: ${{ github.token }}
          expected-default-sha: ${{ inputs.expected-default-sha }}
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main" > /tmp/runs.json
          python3 - <<'PYTHON'
          import json, os
          runs = json.load(open('/tmp/runs.json'))['workflow_runs']
          final = next((r for r in runs if r['event'] in {'push', 'workflow_dispatch'}), None)
          if not (final and final['head_sha'] == os.environ['GITHUB_SHA'] and final['head_branch'] == 'main' and final['status'] == 'completed' and final['conclusion'] == 'success'):
              raise SystemExit('Exact main commit has no successful final CI')
          PYTHON
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # Derived from the committed `packageManager` field, not `latest`:
          # a deploy must build with the same toolchain the gates validated.
          bun-version-file: package.json

      # `--frozen-lockfile` rather than a plain install: installs exactly what
      # bun.lock pins instead of quietly resolving newer versions at deploy time,
      # and fails loudly if the lockfile is out of step with package.json.
      # Matches code-quality.yml, tests.yml and smoke.yml.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - uses: edbfi/automation/actions/dispatch-guard@v1.1.0
        with:
          token: ${{ github.token }}
          expected-default-sha: ${{ inputs.expected-default-sha }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: yt.edb.fi
